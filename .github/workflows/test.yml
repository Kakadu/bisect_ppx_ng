  #     #   env:
  #     #     DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
  #     #   run: bash ./test/ci/binaries.sh

  opam:
    if: ${{github.ref != 'refs/heads/binaries'}}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml:
          #- 5.2.1
          - 5.4.1
          - 5.5.0
          #- 5.5.1

    runs-on: ${{ matrix.os }}
    concurrency:
      group: opam-${{ github.workflow }}-${{ github.ref }}-${{ matrix.ocaml }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v7
    - uses: avsm/setup-ocaml@v3
      with:
        ocaml-compiler: ${{matrix.ocaml}}

    - name: Install opam dependencies
      run: opam install --deps-only --yes .

    # - name: Install ocamlformat (Linux)
    #   if: ${{runner.os == 'Linux'}}
    #   run: |
    #     wget https://github.com/aantron/ocamlformat-binary/releases/download/0.15.0/ocamlformat
    #     sudo mv ocamlformat /usr/local/bin/ocamlformat
    #     sudo chmod a+x /usr/local/bin/ocamlformat

    # - name: Install ocamlformat (non-Linux)
    #   #if: ${{runner.os != 'Linux'}}
    #   run: opam install ocamlformat.0.16.0 --yes

    - name: Install coreutils (Mac)
      if: ${{runner.os == 'macOS'}}
      run: brew install coreutils

    - name: Version feedback
      run: |
        opam --version
        opam exec -- ocaml -version
        truncate --version

    - name: Build
      run: opam exec -- make build

    # The @compatible alias can be removed since due to a constraint in
    # cmdliner, we can no longer test against OCaml < 4.08. Remove it if we
    # commit to not supporting older versions of OCaml.
    - name: Test
      if: ${{runner.os != 'Windows'}}
      run: |
        unset GITHUB_ACTIONS
        unset GITHUB_RUN_NUMBER
        opam exec -- make test TEST=@runtest


    - name: Usage test
      if: ${{ matrix.ocaml == '5.4.1' && runner.os == 'Linux' }}
      run: |
        opam install reason js_of_ocaml --yes
        opam exec -- make clean-usage usage

